name = "web-attendance"
compatibility_date = "2025-12-01"
# NOTE: Removed pages_build_output_dir as it conflicts with proxy command (`-- npm run dev:client`)
# pages_build_output_dir = "dist"

# --- [1] 本番環境（デフォルト）の設定 ---
[vars]
# Use .dev.vars for local development
# Use 'wrangler pages secret put ADMIN_PASSWORD' for production

[[d1_databases]]
binding = "DB"
database_name = "web-attendance-restored-db"
database_id = "88278bbb-2295-4e89-a172-2c82f2c2aa2c"
# database_name = "web-attendance-db"
# database_id = "ecadf217-a410-4a8e-bf0c-a9b4b60a7145"


# --- [2] プレビュー環境の設定 ---
[env.preview]
# 警告通り、vars も preview 用に別途定義が必要
[env.preview.vars]
# プレビュー用の環境変数をここに書く（本番と同じでもOK）

[[env.preview.d1_databases]]
binding = "DB"
database_name = "web-attendance-preview-db"
database_id = "4e4a209f-2892-45a3-b501-8213214bb207"